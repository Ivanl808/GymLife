<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Acceso - GymLife Torniquete</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              500: '#10b981',
              600: '#059669'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-slate-950 font-sans">

  <div id="card-status" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center shadow-2xl relative overflow-hidden transition-all duration-500">
    
    <!-- Animación de fondo / Estado -->
    <div id="status-icon-container" class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl transition-all duration-500 bg-slate-800 text-slate-400">
      <i id="status-icon" class="fa-solid fa-spinner animate-spin"></i>
    </div>

    <h2 id="status-title" class="text-2xl font-extrabold text-white mb-2">Validando Acceso...</h2>
    <p id="status-subtitle" class="text-xs text-slate-400 mb-6">Conectando con el servidor de molinetes GymLife...</p>

    <!-- Información del Socio -->
    <div id="user-info-box" class="hidden bg-slate-950/80 p-5 rounded-2xl border border-slate-800 text-left space-y-3 mb-6">
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Socio:</span>
        <strong id="user-name" class="text-sm text-white font-bold">---</strong>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Correo:</span>
        <span id="user-email" class="text-xs text-slate-300">---</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Estado Membresía:</span>
        <span id="user-status" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase">---</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Hora de Entrada:</span>
        <span id="entry-time" class="text-xs font-mono text-emerald-400 font-bold">---</span>
      </div>
    </div>

    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
      <span>GymLife Control de Acceso</span>
      <span id="server-status"><i class="fa-solid fa-circle text-[8px] text-emerald-500 mr-1"></i>En Línea</span>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token') || urlParams.get('qr');

      if (!token) {
        showStatus('DENEGADO', 'Código QR no proporcionado', 'No se detectó un código válido en el lector.');
        return;
      }

      validarAccesoTorniquete(token);
    });

    async function validarAccesoTorniquete(token) {
      try {
        const response = await fetch(`/api/usuarios/registrar-entrada-torniquete/${encodeURIComponent(token)}`, {
          method: 'POST'
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          if (data.bloqueadoPorAntiPassback) {
            showStatus('ANTIPASSBACK', 'Acceso Bloqueado (Anti-Passback)', data.mensaje, data);
            return;
          }
          throw new Error(data.message || 'Código QR inválido o expirado.');
        }

        if (data.valido) {
          showStatus('PERMITIDO', `¡Bienvenid@, ${data.nombre}!`, 'Pase de entrada concedido. Torniquete Abierto.', data);
        } else {
          showStatus('DENEGADO', 'Acceso Rechazado', 'Membresía no activa o pase no autorizado.', data);
        }
      } catch (err) {
        showStatus('DENEGADO', 'Acceso Rechazado', err.message || 'Error al comunicarse con el servidor de acceso.');
      }
    }

    function showStatus(type, title, subtitle, data = null) {
      const card = document.getElementById('card-status');
      const iconContainer = document.getElementById('status-icon-container');
      const icon = document.getElementById('status-icon');
      const titleElem = document.getElementById('status-title');
      const subtitleElem = document.getElementById('status-subtitle');
      const infoBox = document.getElementById('user-info-box');

      titleElem.textContent = title;
      subtitleElem.textContent = subtitle;

      if (type === 'PERMITIDO') {
        card.className = "w-full max-w-md bg-slate-900 border-2 border-emerald-500/80 p-8 rounded-3xl text-center shadow-2xl shadow-emerald-500/20 relative overflow-hidden transition-all duration-500";
        iconContainer.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl transition-all duration-500 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 animate-bounce";
        icon.className = "fa-solid fa-circle-check";

        if (data) {
          infoBox.classList.remove('hidden');
          document.getElementById('user-name').textContent = data.nombre;
          document.getElementById('user-email').textContent = data.email;
          document.getElementById('user-status').textContent = 'ACTIVO';
          document.getElementById('user-status').className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
          document.getElementById('entry-time').textContent = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          if (data.claseAutoConfirmada && data.claseAutoConfirmada !== '') {
            subtitleElem.innerHTML = `Pase de entrada concedido. Torniquete Abierto.<br/><span class="text-emerald-400 font-bold text-xs block mt-1"><i class="fa-solid fa-clipboard-check mr-1"></i> Check-in Auto-Confirmado en: ${data.claseAutoConfirmada}</span>`;
          }
        }
      } else if (type === 'ANTIPASSBACK') {
        card.className = "w-full max-w-md bg-slate-900 border-2 border-amber-500/80 p-8 rounded-3xl text-center shadow-2xl shadow-amber-500/20 relative overflow-hidden transition-all duration-500";
        iconContainer.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl transition-all duration-500 bg-amber-500/20 text-amber-400 border border-amber-500/40";
        icon.className = "fa-solid fa-clock-rotate-left";

        if (data && data.nombre) {
          infoBox.classList.remove('hidden');
          document.getElementById('user-name').textContent = data.nombre;
          document.getElementById('user-email').textContent = data.email;
          document.getElementById('user-status').textContent = 'ANTI-PASSBACK';
          document.getElementById('user-status').className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-amber-500/20 text-amber-400 border border-amber-500/30';
          document.getElementById('entry-time').textContent = `Bloqueado (${data.minutosRestantes} min)`;
        }
      } else {
        card.className = "w-full max-w-md bg-slate-900 border-2 border-red-500/80 p-8 rounded-3xl text-center shadow-2xl shadow-red-500/20 relative overflow-hidden transition-all duration-500";
        iconContainer.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl transition-all duration-500 bg-red-500/20 text-red-400 border border-red-500/40";
        icon.className = "fa-solid fa-circle-xmark";

        if (data && data.nombre) {
          infoBox.classList.remove('hidden');
          document.getElementById('user-name').textContent = data.nombre;
          document.getElementById('user-email').textContent = data.email;
          document.getElementById('user-status').textContent = 'RECHAZADO';
          document.getElementById('user-status').className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-red-500/20 text-red-400 border border-red-500/30';
          document.getElementById('entry-time').textContent = 'DENEGADO';
        }
      }
    }
  </script>
</body>
</html>
