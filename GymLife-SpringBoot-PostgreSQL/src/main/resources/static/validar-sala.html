<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Acceso a Clase - GymLife</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              500: '#10b981',
              600: '#059669'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-slate-950 font-sans">

  <div id="card-status" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center shadow-2xl relative overflow-hidden transition-all duration-500">
    
    <!-- Animación de fondo / Estado -->
    <div id="status-icon-container" class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl transition-all duration-500 bg-slate-800 text-slate-400">
      <i id="status-icon" class="fa-solid fa-spinner animate-spin"></i>
    </div>

    <h2 id="status-title" class="text-2xl font-extrabold text-white mb-2">Validando Asistencia...</h2>
    <p id="status-subtitle" class="text-xs text-slate-400 mb-6">Procesando pase de entrada al salón de clase...</p>

    <!-- Información del Socio y Clase -->
    <div id="user-info-box" class="hidden bg-slate-950/80 p-5 rounded-2xl border border-slate-800 text-left space-y-3 mb-6">
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Atleta / Socio:</span>
        <strong id="user-name" class="text-sm text-white font-bold">---</strong>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Clase Asignada:</span>
        <strong id="class-name" class="text-xs text-brand-400 font-bold">---</strong>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Estado Reserva:</span>
        <span id="user-status" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase">CONFIRMADO</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-400">Hora de Check-In:</span>
        <span id="entry-time" class="text-xs font-mono text-emerald-400 font-bold">---</span>
      </div>
    </div>

    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
      <span>GymLife Control de Sala</span>
      <span id="server-status"><i class="fa-solid fa-circle text-[8px] text-emerald-500 mr-1"></i>En Línea</span>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token') || urlParams.get('qr');
      const claseId = urlParams.get('claseId') || urlParams.get('clase');

      if (!token) {
        showStatus('DENEGADO', 'Código QR no detectado', 'Presenta un código QR válido en la entrada de la sala.');
        return;
      }

      validarAsistenciaSala(token, claseId);
    });

    async function validarAsistenciaSala(token, claseId) {
      try {
        // 1. Validar primero el usuario por su QR
        const cleanToken = token.startsWith('GYMLIFE-PASS-') ? token.substring('GYMLIFE-PASS-'.length) : token;
        const resUser = await fetch(`/api/usuarios/validar-qr/${encodeURIComponent(cleanToken)}`);
        
        if (!resUser.ok) {
          throw new Error('Socio no reconocido en el sistema.');
        }

        const userData = await resUser.json();

        // Si no vino id de clase explícita, consultar clases del usuario o registrar check-in
        let targetClassId = claseId;
        if (!targetClassId) {
          const resClases = await fetch('/api/clases');
          if (resClases.ok) {
            const listaClases = await resClases.json();
            const claseReservada = listaClases.find(c => c.usuarios && c.usuarios.some(u => u.idUsuario === userData.usuarioId));
            if (claseReservada) {
              targetClassId = claseReservada.idClase;
              document.getElementById('class-name').textContent = claseReservada.nombre;
            } else {
              document.getElementById('class-name').textContent = 'Clase Grupal General';
              targetClassId = listaClases[0]?.idClase || 1;
            }
          }
        }

        // 2. Registrar la asistencia en la clase
        const resAtt = await fetch(`/api/clases/${targetClassId}/asistencia/${userData.usuarioId}?codigoQR=GYMLIFE-PASS-${cleanToken}`, {
          method: 'POST'
        });

        const attData = await resAtt.json().catch(() => ({}));

        if (!resAtt.ok) {
          throw new Error(attData.mensaje || attData.message || 'El socio no cuenta con reserva para esta clase.');
        }

        showStatus('PERMITIDO', `¡Asistencia Confirmada!`, `Pase de sala validado para ${userData.nombre}.`, userData);

      } catch (err) {
        showStatus('DENEGADO', 'Acceso a Sala Rechazado', err.message || 'Error al validar reserva en el salón.');
      }
    }

    function showStatus(type, title, subtitle, data = null) {
      const card = document.getElementById('card-status');
      const iconContainer = document.getElementById('status-icon-container');
      const icon = document.getElementById('status-icon');
      const titleElem = document.getElementById('status-title');
      const subtitleElem = document.getElementById('status-subtitle');
      const infoBox = document.getElementById('user-info-box');

      titleElem.textContent = title;
      subtitleElem.textContent = subtitle;

      if (type === 'PERMITIDO') {
        card.className = "w-full max-w-md bg-slate-900 border-2 border-emerald-500/80 p-8 rounded-3xl text-center shadow-2xl shadow-emerald-500/20 relative overflow-hidden transition-all duration-500";
        iconContainer.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl transition-all duration-500 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 animate-bounce";
        icon.className = "fa-solid fa-clipboard-check";

        if (data) {
          infoBox.classList.remove('hidden');
          document.getElementById('user-name').textContent = data.nombre;
          document.getElementById('user-status').textContent = 'ASISTENCIA OK';
          document.getElementById('user-status').className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
          document.getElementById('entry-time').textContent = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
      } else {
        card.className = "w-full max-w-md bg-slate-900 border-2 border-red-500/80 p-8 rounded-3xl text-center shadow-2xl shadow-red-500/20 relative overflow-hidden transition-all duration-500";
        iconContainer.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl transition-all duration-500 bg-red-500/20 text-red-400 border border-red-500/40";
        icon.className = "fa-solid fa-circle-xmark";

        if (data && data.nombre) {
          infoBox.classList.remove('hidden');
          document.getElementById('user-name').textContent = data.nombre;
          document.getElementById('user-status').textContent = 'NO RESERVADO';
          document.getElementById('user-status').className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase bg-red-500/20 text-red-400 border border-red-500/30';
          document.getElementById('entry-time').textContent = 'RECHAZADO';
        }
      }
    }
  </script>
</body>
</html>
